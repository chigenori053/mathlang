[project]
name = "mathlang"
version = "0.1.0"
description = "MathLang — a DSL for capturing, replaying, and verifying mathematical reasoning"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "sympy>=1.13",
    "lark-parser>=0.12",
    "streamlit>=1.38",
    "jupyter>=1.0",
    "pytest>=8.4.2",
    "PyYAML>=6.0",
    "pygls[ws]>=2.1.1",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
]
