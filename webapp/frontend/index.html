<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .cm-editor { border: 1px solid #cfcfcf; font-size: 14px; }
  .cm-editor.cm-focused { outline: none; border-left: 2px solid #6c8ef5; }
  .mathlang-hover-tooltip {
    max-width: 320px;
    padding: 6px 8px;
    background: #23272e;
    color: #f0f0f0;
    font-size: 12px;
    line-height: 1.4;
    border-radius: 4px;
  }
</style>
</head>
<body>
<div id="editor"></div>
<script type="module">
import { EditorView, basicSetup } from "https://esm.sh/codemirror@6.0.2";
import { EditorState } from "https://esm.sh/@codemirror/state@6";
import { linter, lintGutter, setDiagnostics } from "https://esm.sh/@codemirror/lint@6";
import { hoverTooltip } from "https://esm.sh/@codemirror/view@6";

// ---- Streamlit static-component wire protocol (hand-rolled, no build step). ----
// Protocol verified against streamlit/streamlit's component-lib source
// (frontend/component-lib/src/streamlit.ts): outgoing messages are posted to
// window.parent as {isStreamlitMessage: true, type, ...data}; the incoming
// render event is a plain MessageEvent whose payload lives at event.data
// (args/theme/disabled), not event.data.detail.
const RENDER_EVENT = "streamlit:render";

function sendToStreamlit(type, data) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data), "*");
}

function setFrameHeight(height) {
  sendToStreamlit("streamlit:setFrameHeight", { height });
}

function setComponentValue(value) {
  sendToStreamlit("streamlit:setComponentValue", { value, dataType: "json" });
}

// ---- Minimal JSON-RPC 2.0 client over WebSocket. ----
// pygls's start_ws() transport sends/receives one raw JSON message per
// WebSocket frame (protocol.set_writer(..., include_headers=False)) so no
// Content-Length framing is needed here, unlike LSP-over-stdio.
class LspClient {
  constructor(url) {
    this.url = url;
    this.nextId = 1;
    this.pending = new Map();
    this.notificationHandlers = new Map();
    this.ready = new Promise((resolve) => {
      this._resolveReady = resolve;
    });
    this._connect();
  }

  _connect() {
    this.ws = new WebSocket(this.url);
    this.ws.addEventListener("open", async () => {
      try {
        await this.request("initialize", { processId: null, rootUri: null, capabilities: {} });
        this.notify("initialized", {});
        this._resolveReady();
      } catch {
        // Connection dropped mid-handshake; the "close" listener below retries.
      }
    });
    this.ws.addEventListener("message", async (event) => {
      // pygls's websockets-based writer sends binary frames, so the browser
      // delivers each message as a Blob rather than a string.
      let raw = event.data;
      if (raw instanceof Blob) {
        raw = await raw.text();
      } else if (raw instanceof ArrayBuffer) {
        raw = new TextDecoder("utf-8").decode(raw);
      }
      let msg;
      try {
        msg = JSON.parse(raw);
      } catch {
        return;
      }
      if (msg.id !== undefined && this.pending.has(msg.id)) {
        const { resolve, reject } = this.pending.get(msg.id);
        this.pending.delete(msg.id);
        if (msg.error) reject(msg.error);
        else resolve(msg.result);
      } else if (msg.method && this.notificationHandlers.has(msg.method)) {
        this.notificationHandlers.get(msg.method)(msg.params);
      }
    });
    this.ws.addEventListener("close", () => {
      setTimeout(() => this._connect(), 2000);
    });
  }

  on(method, handler) {
    this.notificationHandlers.set(method, handler);
  }

  notify(method, params) {
    if (this.ws.readyState !== WebSocket.OPEN) return;
    this.ws.send(JSON.stringify({ jsonrpc: "2.0", method, params }));
  }

  request(method, params) {
    const id = this.nextId++;
    return new Promise((resolve, reject) => {
      this.pending.set(id, { resolve, reject });
      this.ws.send(JSON.stringify({ jsonrpc: "2.0", id, method, params }));
      setTimeout(() => {
        if (this.pending.has(id)) {
          this.pending.delete(id);
          reject(new Error(`LSP request timed out: ${method}`));
        }
      }, 4000);
    });
  }
}

// ---- Diagnostic mapping: LSP (line, character) -> CodeMirror document offset. ----
function severityFromLsp(sev) {
  // LSP DiagnosticSeverity: 1=Error, 2=Warning, 3=Information, 4=Hint
  if (sev === 2) return "warning";
  if (sev === 3 || sev === 4) return "info";
  return "error";
}

function offsetForPosition(doc, position) {
  const lineNumber = Math.min(position.line + 1, doc.lines);
  const line = doc.line(lineNumber);
  return Math.min(line.from + position.character, line.to);
}

function toCmDiagnostics(doc, lspDiagnostics) {
  return lspDiagnostics.map((d) => {
    const from = offsetForPosition(doc, d.range.start);
    let to = offsetForPosition(doc, d.range.end);
    if (to <= from) to = Math.min(from + 1, doc.length);
    return { from, to, severity: severityFromLsp(d.severity), message: d.message };
  });
}

// ---- Component state (one instance per iframe/cell). ----
let view = null;
let lsp = null;
let docUri = "";
let docVersion = 1;
let debounceTimer = null;

function scheduleSync() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(async () => {
    const text = view.state.doc.toString();
    setComponentValue(text);
    if (!lsp) return;
    await lsp.ready;
    docVersion += 1;
    lsp.notify("textDocument/didChange", {
      textDocument: { uri: docUri, version: docVersion },
      contentChanges: [{ text }],
    });
  }, 300);
}

function buildHoverExtension() {
  return hoverTooltip(async (hoverView, pos) => {
    if (!lsp) return null;
    await lsp.ready;
    const line = hoverView.state.doc.lineAt(pos);
    const result = await lsp
      .request("textDocument/hover", {
        textDocument: { uri: docUri },
        position: { line: line.number - 1, character: pos - line.from },
      })
      .catch(() => null);
    if (!result || !result.contents) return null;
    const text = typeof result.contents === "string" ? result.contents : result.contents.value;
    return {
      pos,
      create() {
        const dom = document.createElement("div");
        dom.className = "mathlang-hover-tooltip";
        dom.textContent = text;
        return { dom };
      },
    };
  });
}

function onRender(event) {
  const { value, lsp_url: lspUrl, height } = event.data.args;

  if (window.__mathlangInitialized) return;
  window.__mathlangInitialized = true;

  docUri = `file:///cell-${Math.random().toString(36).slice(2)}.mlang`;
  lsp = new LspClient(lspUrl);
  lsp.on("textDocument/publishDiagnostics", (params) => {
    if (!view) return;
    view.dispatch(setDiagnostics(view.state, toCmDiagnostics(view.state.doc, params.diagnostics)));
  });
  lsp.ready.then(() => {
    lsp.notify("textDocument/didOpen", {
      textDocument: { uri: docUri, languageId: "mathlang", version: 1, text: value },
    });
  });

  const updateListener = EditorView.updateListener.of((update) => {
    if (update.docChanged) scheduleSync();
  });

  const state = EditorState.create({
    doc: value,
    extensions: [
      basicSetup,
      EditorView.lineWrapping,
      linter(() => []),
      lintGutter(),
      buildHoverExtension(),
      updateListener,
    ],
  });
  view = new EditorView({ state, parent: document.getElementById("editor") });
  setFrameHeight(height || 200);
}

window.addEventListener("message", (event) => {
  if (event.data && event.data.type === RENDER_EVENT) onRender(event);
});
sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
setFrameHeight(200);
</script>
</body>
</html>
